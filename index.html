<!-- JAVASCRIPT LOGIC PRESISI SESUAI STRUKTUR TAB & KOLOM SPREADSHEET -->
    <script>
        // Masukkan ID Spreadsheet baru di sini (jika membuat file sheet baru, ganti ID-nya di bawah ini)
        const SPREADSHEET_ID = "1h2YSAsX4ohdkN5D3db-Q2AHs7ESdOrcEnmRXVFSgwHw";
        
        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);

        const staticData = {
            kultum: [
                { hari: "Ramadhan 1", tanggal: "19 Feb 2026", tarawih: "Ust. Ahmad Hidayat, S.Ag", subuh: "Ust. Muhammad Ridwan, M.A" },
                { hari: "Ramadhan 2", tanggal: "20 Feb 2026", tarawih: "Ust. Dr. H. Abdul Ghofur", subuh: "Ust. Ahmad Hidayat, S.Ag" },
                { hari: "Ramadhan 3", tanggal: "21 Feb 2026", tarawih: "Ust. Farhan Basalamah, Lc", subuh: "Ust. Nuruddin, M.Pd" }
            ],
            agenda: [
                { tanggal_badge: "17 Ramadhan", waktu: "19.30 WIB", judul: "Peringatan Nuzulul Qur'an", deskripsi: "Pengajian umum & tasyakuran memperingati Nuzulul Qur'an bersama jamaah.", lokasi: "Ruang Utama Masjid Al-Marhamah" },
                { tanggal_badge: "Setiap Hari", waktu: "17.30 WIB", judul: "Buka Puasa Bersama (Takjil)", deskripsi: "Penyediaan santapan berbuka puasa gratis untuk jamaah & musafir.", lokasi: "Serambi Masjid Al-Marhamah" },
                { tanggal_badge: "10 Malam Terakhir", waktu: "01.00 WIB", judul: "I'tikaf & Qiyamul Lail", deskripsi: "Penyelenggaraan sholat malam berjamaah & sahur bersama pemburu Lailatul Qadar.", lokasi: "Ruang Utama Masjid" }
            ],
            galeri: [
                { judul: "Sholat Tarawih Berjamaah", ket: "Malam 1 Ramadhan", url: "https://images.unsplash.com/photo-1564769625905-50e93615e769?q=80&w=600&auto=format&fit=crop" },
                { judul: "Pembagian Takjil", ket: "Serambi Masjid", url: "https://images.unsplash.com/photo-1584551246679-0daf3d275d0f?q=80&w=600&auto=format&fit=crop" },
                { judul: "Tadarus Al-Qur'an", ket: "Ba'da Tarawih", url: "https://images.unsplash.com/photo-1609599006353-e629aaabfeae?q=80&w=600&auto=format&fit=crop" },
                { judul: "Posko Amil Zakat", ket: "Pelayanan ZIS", url: "https://images.unsplash.com/photo-1519817650390-64a93db51149?q=80&w=600&auto=format&fit=crop" }
            ]
        };

        function parseCSVLine(text) {
            const result = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    result.push(cur.trim().replace(/^"|"$/g, ''));
                    cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur.trim().replace(/^"|"$/g, ''));
            return result;
        }

        async function fetchCSVRows(tabNames) {
            for (const sheetName of tabNames) {
                try {
                    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const csvText = await res.text();
                    const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
                    if (lines.length > 1) {
                        return lines.slice(1).map(line => parseCSVLine(line));
                    }
                } catch (err) {
                    console.warn(`Mencoba tab berikutnya setelah gagal pada: ${sheetName}`, err);
                }
            }
            return [];
        }

        function parseNum(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return val;
            const clean = String(val).replace(/[^0-9.-]+/g, "");
            const num = parseFloat(clean);
            return isNaN(num) ? 0 : num;
        }

        async function renderAllData() {
            renderStaticSections();

            // 1. Ambil Tab Infak Harian: "Form_Responses" / "Form Responses 1"
            try {
                const rowsInfak = await fetchCSVRows(["Form_Responses", "Form Responses 1", "Form Responses"]);
                if (rowsInfak && rowsInfak.length > 0) {
                    renderInfakHarian(rowsInfak);
                    const lastRow = rowsInfak[rowsInfak.length - 1];
                    if (lastRow && lastRow[0]) {
                        const badge = document.getElementById('last-update');
                        if (badge) badge.innerText = String(lastRow[0]);
                    }
                }
            } catch (e) {
                console.error("Gagal Render Infak:", e);
            }

            // 2. Ambil Tab ZIS: "Form_Responses2" / "Form Responses 2"
            try {
                const rowsZis = await fetchCSVRows(["Form_Responses2", "Form Responses 2"]);
                if (rowsZis && rowsZis.length > 0) {
                    renderZisCards(rowsZis);
                }
            } catch (e) {
                console.error("Gagal Render ZIS:", e);
            }
        }

        function renderInfakHarian(rows) {
            const tbody = document.getElementById('infak-harian-tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            let totalTarawih = 0;
            let totalSubuh = 0;

            rows.forEach((row, index) => {
                // Sesuai screenshot: Kolom 0 = Timestamp, Kolom 1 = Tanggal, Kolom 2 = Infaq Tarawih, Kolom 3 = Infaq Subuh
                const hari = `Ramadhan ${index + 1}`;
                const tanggal = row[1] ? String(row[1]) : '-';
                const tarawih = parseNum(row[2]);
                const subuh = parseNum(row[3]);
                const total = tarawih + subuh;

                totalTarawih += tarawih;
                totalSubuh += subuh;

                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-slate-900/40' : 'bg-slate-950/40';
                tr.innerHTML = `
                    <td class="py-3.5 px-6 font-semibold text-gold-300">${hari}</td>
                    <td class="py-3.5 px-6 text-slate-400">${tanggal}</td>
                    <td class="py-3.5 px-6 text-right font-mono text-slate-200">${formatRp(tarawih)}</td>
                    <td class="py-3.5 px-6 text-right font-mono text-slate-200">${formatRp(subuh)}</td>
                    <td class="py-3.5 px-6 text-right font-mono font-bold text-gold-400">${formatRp(total)}</td>
                `;
                tbody.appendChild(tr);
            });

            const elTotalTarawih = document.getElementById('total-tarawih');
            const elTotalSubuh = document.getElementById('total-subuh');
            const elTotalGabungan = document.getElementById('total-gabungan-harian');

            if (elTotalTarawih) elTotalTarawih.innerText = formatRp(totalTarawih);
            if (elTotalSubuh) elTotalSubuh.innerText = formatRp(totalSubuh);
            if (elTotalGabungan) elTotalGabungan.innerText = formatRp(totalTarawih + totalSubuh);
        }

        function renderZisCards(rows) {
            let totalBeras = 0;
            let totalMaal = 0;
            let totalFidyah = 0;
            let totalInfak = 0;

            // Sesuai screenshot Form_Responses2:
            // Kolom 0 = Timestamp, Kolom 1 = Tanggal, Kolom 2 = Zakat Fitrah(Kg), Kolom 3 = Zakat Mal(Rp), Kolom 4 = Fidyah(Rp), Kolom 5 = Infaq/Shodaqoh(Rp)
            rows.forEach(row => {
                totalBeras += parseNum(row[2]);
                totalMaal += parseNum(row[3]);
                totalFidyah += parseNum(row[4]);
                totalInfak += parseNum(row[5]);
            });

            const elBeras = document.getElementById('zis-fitrah-beras');
            const elFitrahUang = document.getElementById('zis-fitrah-uang');
            const elMaal = document.getElementById('zis-maal');
            const elFidyah = document.getElementById('zis-fidyah');
            const elInfak = document.getElementById('zis-infak-umum');

            if (elBeras) elBeras.innerText = `${totalBeras.toLocaleString('id-ID')} Kg`;
            if (elFitrahUang) elFitrahUang.innerText = formatRp(0); // Sesuai form baru yang hanya beras
            if (elMaal) elMaal.innerText = formatRp(totalMaal);
            if (elFidyah) elFidyah.innerText = formatRp(totalFidyah);
            if (elInfak) elInfak.innerText = formatRp(totalInfak);
        }

        function renderStaticSections() {
            const kultumTbody = document.getElementById('kultum-tbody');
            if (kultumTbody) {
                kultumTbody.innerHTML = '';
                staticData.kultum.forEach((item, index) => {
                    const row = document.createElement('tr');
                    row.className = index % 2 === 0 ? 'bg-slate-900/40' : 'bg-slate-950/40';
                    row.innerHTML = `
                        <td class="py-3.5 px-6 font-semibold text-gold-300">${item.hari}</td>
                        <td class="py-3.5 px-6 text-slate-400">${item.tanggal}</td>
                        <td class="py-3.5 px-6 font-medium text-white">${item.tarawih}</td>
                        <td class="py-3.5 px-6 font-medium text-white">${item.subuh}</td>
                    `;
                    kultumTbody.appendChild(row);
                });
            }

            const agendaContainer = document.getElementById('agenda-container');
            if (agendaContainer) {
                agendaContainer.innerHTML = '';
                staticData.agenda.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "glass-card rounded-2xl p-6 border border-gold-500/30 hover:border-gold-500/60 transition-all";
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs bg-gold-500/20 text-gold-300 font-bold px-3 py-1 rounded-full border border-gold-500/30">${item.tanggal_badge}</span>
                            <span class="text-[11px] text-emerald-400 font-medium">${item.waktu}</span>
                        </div>
                        <h4 class="text-lg font-bold text-white mb-2">${item.judul}</h4>
                        <p class="text-xs text-slate-300 leading-relaxed mb-4">${item.deskripsi}</p>
                        <div class="text-[11px] text-slate-400 flex items-center">
                            <i class="fa-solid fa-location-dot text-gold-400 mr-2"></i> ${item.lokasi}
                        </div>
                    `;
                    agendaContainer.appendChild(card);
                });
            }

            const galeriContainer = document.getElementById('galeri-container');
            if (galeriContainer) {
                galeriContainer.innerHTML = '';
                staticData.galeri.forEach(item => {
                    const imgCard = document.createElement('div');
                    imgCard.className = "group relative overflow-hidden rounded-2xl border border-gold-500/20 aspect-square";
                    imgCard.innerHTML = `
                        <img src="${item.url}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-emerald-950/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-4 flex flex-col justify-end">
                            <p class="text-xs font-bold text-gold-300">${item.judul}</p>
                            <p class="text-[10px] text-slate-300">${item.ket}</p>
                        </div>
                    `;
                    galeriContainer.appendChild(imgCard);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', renderAllData);
    </script>
